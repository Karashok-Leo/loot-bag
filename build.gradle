plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {

}

fabricApi {
    configureDataGeneration(setting -> {
        setting.setOutputDirectory(project.file("example"))
        setting.setAddToResources(false)
    })
}

runDatagen.doLast {
    copy {
        from("example/data")
        into("run/global_packs/required_data/loot_bag/data")
    }
    copy {
        from("example/assets")
        into("run/global_packs/required_resources/loot_bag/assets")
    }
    copy {
        from("run/global_packs/required_data/loot_bag/pack.mcmeta")
        into("example")
    }
}

repositories {
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}

def changelogText = providers.provider {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.isFile() || changelogFile.getText('UTF-8').trim().isEmpty()) {
        throw new GradleException("Write the release notes in ${changelogFile.name} before publishing or previewing.")
    }
    changelogFile.getText('UTF-8')
}

def localToken = { String filename ->
    def tokenFile = rootProject.file(filename)
    providers.provider {
        if (!tokenFile.isFile()) {
            throw new GradleException("Create ${filename} in the repository root and put the upload token on one line.")
        }
        def token = tokenFile.getText('UTF-8').replaceFirst('^\uFEFF', '').trim()
        if (token.isEmpty() || token.contains('\n') || token.contains('\r')) {
            throw new GradleException("${filename} must contain one non-empty upload token, without quotes or a property name.")
        }
        token
    }
}

def publishDryRun = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'publishModsDryRun'
}

publishMods {
    file = remapJar.archiveFile
    displayName = file.map { it.asFile.name }
    changelog = changelogText
    type = STABLE
    modLoaders.add('fabric')
    dryRun = publishDryRun

    curseforge {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = localToken('curseforge-token')
        minecraftVersions.add(project.minecraft_version)
        requires('fabric-api')
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
    }
    modrinth {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = localToken('modrinth-token')
        minecraftVersions.add(project.minecraft_version)
        requires('fabric-api')
        environment = CLIENT_AND_SERVER
    }
}

tasks.register('publishModsDryRun') {
    group = 'publishing'
    description = 'Preview mod publishing without uploading.'
    dependsOn tasks.named('publishMods')
}
