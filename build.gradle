plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'dev.architectury.loom' version '1.14.476'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    forge { }
    runs {
        data {
            data()
            programArgs '--mod', 'loot_bag', '--all', '--output', file('example').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

repositories { mavenLocal() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
tasks.withType(Jar).configureEach { exclude '.cache/**' }
tasks.named('runData') { dependsOn tasks.named('downloadAssets') }
tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }


publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories { mavenLocal() }
}

def changelogText = providers.provider {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.isFile() || changelogFile.getText('UTF-8').trim().isEmpty()) {
        throw new GradleException("Write the release notes in ${changelogFile.name} before publishing or previewing.")
    }
    changelogFile.getText('UTF-8')
}

def localToken = { String filename ->
    def tokenFile = rootProject.file(filename)
    providers.provider {
        if (!tokenFile.isFile()) {
            throw new GradleException("Create ${filename} in the repository root and put the upload token on one line.")
        }
        def token = tokenFile.getText('UTF-8').replaceFirst('^\uFEFF', '').trim()
        if (token.isEmpty() || token.contains('\n') || token.contains('\r')) {
            throw new GradleException("${filename} must contain one non-empty upload token, without quotes or a property name.")
        }
        token
    }
}

def publishDryRun = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'publishModsDryRun'
}

publishMods {
    file = remapJar.archiveFile
    displayName = file.map { it.asFile.name }
    changelog = changelogText
    type = STABLE
    modLoaders.add('forge')
    dryRun = publishDryRun

    curseforge {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = localToken('curseforge-token')
        minecraftVersions.add(project.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
    }
    modrinth {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = localToken('modrinth-token')
        minecraftVersions.add(project.minecraft_version)
        environment = CLIENT_AND_SERVER
    }
}

tasks.register('publishModsDryRun') {
    group = 'publishing'
    description = 'Preview mod publishing without uploading.'
    dependsOn tasks.named('publishMods')
}
