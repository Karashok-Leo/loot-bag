plugins {
    id 'dev.architectury.loom' version '1.10.455'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    forge { }
    runs {
        data {
            data()
            programArgs '--mod', 'loot_bag', '--all', '--output', file('example').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

repositories { mavenLocal() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
tasks.withType(Jar).configureEach { exclude '.cache/**' }
tasks.named('runData') { dependsOn tasks.named('downloadAssets') }
tasks.named('sourcesJar') { mustRunAfter tasks.named('runData') }


publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories { mavenLocal() }
}

// Runtime-only regression checks. This source set is not included in published jars.
sourceSets {
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom.mods {
    main {
        sourceSet sourceSets.main
        sourceSet sourceSets.validation
    }
}
tasks.named('runData') {
    dependsOn tasks.named('validationClasses')
    def report = layout.buildDirectory.file('reports/forge-validation.json')
    systemProperty 'loot_bag.validation.report', report.get().asFile.absolutePath
    systemProperty 'loot_bag.validation.examples', file('example').absolutePath
    doFirst { delete report }
    doLast {
        if (!report.get().asFile.exists() || new groovy.json.JsonSlurper().parse(report.get().asFile).passed != 15)
            throw new GradleException('Loot Bag Forge runtime regression checks did not complete.')
    }
}
tasks.named('check') { dependsOn tasks.named('runData') }
