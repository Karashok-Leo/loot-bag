import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.darkhax.curseforgegradle' version '1.3.33'
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {

}

fabricApi {
    configureDataGeneration(setting -> {
        setting.setOutputDirectory(project.file("example"))
        setting.setAddToResources(false)
    })
}

runDatagen.doLast {
    copy {
        from("example/data")
        into("run/global_packs/required_data/loot_bag/data")
    }
    copy {
        from("example/assets")
        into("run/global_packs/required_resources/loot_bag/assets")
    }
    copy {
        from("run/global_packs/required_data/loot_bag/pack.mcmeta")
        into("example")
    }
}

repositories {
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}

// CurseForge publishing
def tokenFile = rootProject.file('curseforge-token')
// Use release notes when present; no generated changelog is committed.
def changelogFile = rootProject.file('CHANGELOG.md')
def changelog = providers.provider {
    changelogFile.isFile() ? changelogFile.getText('UTF-8')
            : "Loot Bag ${project.version} for Minecraft ${project.minecraft_version} (Fabric)."
}
def releaseType = providers.gradleProperty('curseforge_release_type')
def cfProjectId = providers.gradleProperty('curseforge_project_id')

def readToken = {
    if (!tokenFile.isFile()) {
        throw new GradleException('Create curseforge-token in the repository root and put your CurseForge upload token on one line.')
    }
    def token = tokenFile.getText('UTF-8').replaceFirst('^\uFEFF', '').trim()
    if (token.isEmpty()|| token.contains('\n') || token.contains('\r')) {
        throw new GradleException('curseforge-token must contain one non-empty CurseForge upload token, without quotes or a property name.')
    }
    return token
}

['publishCurseForge': false, 'previewCurseForge': true].each { taskName, preview ->
    tasks.register(taskName, TaskPublishCurseForge) {
        group = 'publishing'
        description = preview
                ? 'Builds the release JAR and previews CurseForge metadata without uploading or reading the token.'
                : 'Builds and publishes the release JAR to CurseForge.'
        dependsOn tasks.named('build')
        // This plugin accesses project state while executing its task.
        notCompatibleWithConfigurationCache('CurseForgeGradle uses project state during publication.')
        debugMode = preview
        // Resolve credentials only during actual publication, never during configuration.
        apiToken = preview ? 'preview-no-token-required' : readToken
        disableVersionDetection()

        def artifact = upload(cfProjectId.get(), tasks.named('remapJar').flatMap { it.archiveFile })
        artifact.releaseType = releaseType
        artifact.changelog = changelog
        artifact.changelogType = 'markdown'
        artifact.addGameVersion(project.minecraft_version)
        artifact.addModLoader('Fabric')
        artifact.addEnvironment('Client', 'Server')
        artifact.addRequirement('fabric-api')

        doFirst {
            if (!(releaseType.get() in ['alpha', 'beta', 'release'])) {
                throw new GradleException('curseforge_release_type must be alpha, beta or release.')
            }
            if (changelog.get().trim().isEmpty()) {
                throw new GradleException("Write the release notes in ${changelogFile.name} before publishing or previewing.")
            }
            if (!preview) {
                readToken()
            }
        }
    }
}
